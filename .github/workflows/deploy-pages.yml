name: Deploy data explorer to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 分享卡片用 matplotlib 绘制，中文字体缺失会渲染成豆腐块，
      # build_site_pages.py 检测不到可用字体时会直接报错而不是静默产出。
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --quiet matplotlib

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp 70cityprice.csv _site/70cityprice.csv
          asset_version="${GITHUB_SHA::12}"
          python3 scripts/build_site_data.py --output-dir _site/data
          python3 scripts/build_site_pages.py \
            --site-dir _site \
            --origin "https://hugohe3.github.io/70cityprice" \
            --build-version "${asset_version}"
          sed -i "s/__BUILD_VERSION__/${asset_version}/g" _site/index.html
          rm -f _site/data/.gitkeep
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
